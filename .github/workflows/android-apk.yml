name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Debug APK
        run: |
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk avro-keyboard-debug.apk

      - name: Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk avro-keyboard-release.apk

      - name: Release AAB
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab avro-keyboard-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: avro-keyboard-builds
          path: |
            avro-keyboard-debug.apk
            avro-keyboard-release.apk
            avro-keyboard-release.aab
          if-no-files-found: error
